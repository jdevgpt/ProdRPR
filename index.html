<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ProdRPR</title>
<meta name="description" content="ProdRPR - Registro diario de producción RPR">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ff7a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --orange:#ff7a00;--orange-d:#e06a00;--orange-l:#fff3e8;
    --bg:#f3f4f6;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;
    --red:#dc2626;--green:#16a34a;
    --r:14px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);line-height:1.35}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;font-size:16px} /* 16px evita zoom en iOS */

  /* Cabecera fija */
  .top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--orange);padding:10px 16px calc(10px) 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  .top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .brand{flex:1;min-width:0}
  .brand h1{margin:0;font-size:20px;color:var(--orange);letter-spacing:.3px}
  .brand small{color:var(--muted);font-size:12px}
  .datebox{display:flex;align-items:center;gap:4px}
  .datebox input{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;min-width:0;width:150px}
  .iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:18px;display:grid;place-items:center;flex:none}
  .iconbtn:active{background:var(--orange-l)}
  .todaybtn{border:none;background:var(--orange-l);color:var(--orange-d);border-radius:10px;padding:0 10px;height:40px;font-weight:600;font-size:13px}

  .wrap{max-width:760px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h2{margin:0 0 10px;font-size:16px}
  label.l{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
  .field{margin-bottom:12px}
  .inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
  .inp:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:transparent}
  textarea.inp{resize:vertical;min-height:80px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.on{background:var(--orange);color:#fff;border-color:var(--orange)}

  /* Pestañas */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:14px}
  .tab{border:none;background:transparent;padding:11px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
  .tab.on{background:#fff;color:var(--orange-d);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font-weight:700;color:var(--text)}
  .seg button.on{background:var(--orange);border-color:var(--orange);color:#fff}

  .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .g2 > *{min-width:0}
  .namerow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:12px}
  .namerow > *{min-width:0}
  .namerow .seg button{padding:12px 0}
  .switch span{min-width:0;overflow-wrap:anywhere}
  .brand,.datebox{min-width:0}
  .stepper{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .stepper button{width:46px;border:none;background:var(--bg);font-size:22px;color:var(--text);flex:none}
  .stepper button:active{background:var(--orange-l)}
  .stepper input{flex:1;min-width:0;border:none;text-align:center;padding:12px 4px;font-weight:700;background:#fff;color:var(--text)}
  .stepper input:focus{outline:none}

  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;user-select:none}
  .switch span{font-weight:600;font-size:14px}
  .switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:#d1d5db;position:relative;flex:none;transition:.15s;margin:0}
  .switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked{background:var(--orange)}
  .switch input:checked::after{left:21px}

  .addrow{display:flex;gap:8px}
  .addrow .inp{flex:1;min-width:0}
  .deflist{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .defitem{display:flex;align-items:flex-start;gap:8px;background:var(--orange-l);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
  .defitem div{flex:1;word-break:break-word}
  .x{border:none;background:transparent;color:var(--red);font-size:20px;line-height:1;padding:2px 6px}

  .btn{border:none;border-radius:12px;padding:14px 16px;font-weight:700;font-size:15px;background:var(--orange);color:#fff}
  .btn:active{background:var(--orange-d)}
  .btn.sec{background:#fff;color:var(--text);border:1px solid var(--line)}
  .btn.sec:active{background:var(--bg)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
  .btn.sm{padding:10px 12px;font-size:14px;border-radius:10px}
  .btn.add{padding:0 16px}
  .actions{display:flex;gap:8px;margin-top:4px}
  .actions .btn:first-child{flex:1}

  .editbar{display:none;align-items:center;justify-content:space-between;gap:8px;background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;font-weight:600}
  .editbar.on{display:flex}
  .editbar button{border:none;background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;color:#92400e}

  /* Totales */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--orange-d);font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted)}
  .stat em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}

  .share{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
  .share .wa{background:#25d366}
  .share .wa:active{background:#1ebe5a}

  /* Registro */
  .lineblock{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
  .linehead{display:flex;align-items:center;gap:8px;background:var(--orange-l);padding:10px 12px}
  .linehead h3{margin:0;font-size:15px;flex:1;word-break:break-word}
  .linehead small{color:var(--muted);font-size:12px;font-weight:400;display:block}
  .sub{padding:8px 12px 2px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .rec{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
  .sub + .rec{border-top:none}
  .rec .body{flex:1;min-width:0;font-size:14px;word-break:break-word}
  .rec .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .rec ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:#92400e}
  .rec .ops{display:flex;flex-direction:column;gap:4px}
  .op{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text)}
  .op.del{color:var(--red)}
  .tag{display:inline-block;background:var(--orange);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-right:4px}
  .tag.p{background:#374151}
  .empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:14px}

  details.more{background:var(--card);border-radius:var(--r);padding:0 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  details.more summary{padding:14px 0;font-weight:700;cursor:pointer;list-style:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::after{content:"▾";float:right;color:var(--muted)}
  details.more[open] summary::after{content:"▴"}
  .morebody{display:flex;flex-direction:column;gap:8px;padding-bottom:14px}
  .hint{font-size:13px;color:var(--muted);margin:4px 0 0}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}

  .hide{display:none!important}
  @media(max-width:380px){
    .datebox input{width:130px}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>ProdRPR</h1>
      <small id="dateLabel">Registro producción RPR</small>
    </div>
    <div class="datebox">
      <button class="iconbtn" id="prevDay" aria-label="Día anterior">‹</button>
      <input id="date" type="date" aria-label="Fecha">
      <button class="iconbtn" id="nextDay" aria-label="Día siguiente">›</button>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- Línea -->
  <section class="card">
    <div class="field" style="margin:0">
      <label class="l" for="lineName">Nombre de línea</label>
      <input id="lineName" class="inp" type="text" list="lineList" placeholder="Ej: Línea 1 - Almendralejo" autocomplete="off">
      <datalist id="lineList"></datalist>
      <div class="chips" id="recentLines"></div>
    </div>
  </section>

  <!-- Formularios -->
  <section class="card" id="formCard">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="centros">Centros</button>
      <button class="tab" data-tab="lineaAerea">Línea aérea</button>
      <button class="tab" data-tab="incidencias">Incidencias</button>
    </div>

    <div class="editbar" id="editBar"><span id="editText">Editando</span><button id="cancelEdit">Cancelar</button></div>

    <!-- CENTROS -->
    <div data-panel="centros">
      <div class="field namerow">
        <div>
          <label class="l" for="c_name">Centro</label>
          <input id="c_name" class="inp" type="text" autocomplete="off" autocapitalize="characters" placeholder="Nº">
        </div>
        <div>
          <label class="l">Tipo</label>
          <div class="seg" id="c_type">
            <button data-v="CT" class="on">CT</button><button data-v="PT">PT</button><button data-v="ST">ST</button>
          </div>
        </div>
      </div>
      <div class="g2 field">
        <div>
          <label class="l" for="c_repos">Reposiciones</label>
          <div class="stepper"><button data-step="-1" data-for="c_repos">−</button><input id="c_repos" type="number" inputmode="numeric" min="0" value="0"><button data-step="1" data-for="c_repos">+</button></div>
        </div>
        <div>
          <label class="l">&nbsp;</label>
          <label class="switch"><span>Puntual</span><input id="c_punctual" type="checkbox"></label>
        </div>
      </div>
      <div class="field">
        <label class="l" for="c_def_text">Defectos</label>
        <div class="addrow"><input id="c_def_text" class="inp" type="text" placeholder="Descripción del defecto" autocomplete="off"><button class="btn add" id="c_add_def">Añadir</button></div>
        <div class="deflist" id="c_def_list"></div>
      </div>
      <div class="actions"><button class="btn" id="c_save">Guardar centro</button><button class="btn sec" id="c_clear">Limpiar</button></div>
    </div>

    <!-- LÍNEA AÉREA -->
    <div data-panel="lineaAerea" class="hide">
      <div class="g2 field">
        <div>
          <label class="l" for="l_repos">Reposiciones</label>
          <div class="stepper"><button data-step="-1" data-for="l_repos">−</button><input id="l_repos" type="number" inputmode="numeric" min="0" value="0"><button data-step="1" data-for="l_repos">+</button></div>
        </div>
        <div>
          <label class="l" for="l_medidas">Medidas</label>
          <div class="stepper"><button data-step="-1" data-for="l_medidas">−</button><input id="l_medidas" type="number" inputmode="numeric" min="0" value="0"><button data-step="1" data-for="l_medidas">+</button></div>
        </div>
      </div>
      <div class="field">
        <label class="l" for="l_kms">Kilómetros revisados</label>
        <div class="stepper"><button data-step="-0.5" data-for="l_kms">−</button><input id="l_kms" type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" value="0" autocomplete="off"><button data-step="0.5" data-for="l_kms">+</button></div>
      </div>
      <div class="g2 field">
        <label class="switch"><span>Medidas puntual</span><input id="l_med_punct" type="checkbox"></label>
        <label class="switch"><span>Kms puntual</span><input id="l_kms_punct" type="checkbox"></label>
      </div>
      <div class="field">
        <label class="l">Defectos</label>
        <input id="l_def_ubic" class="inp" type="text" placeholder="Ubicación (apoyo, vano…)" autocomplete="off" style="margin-bottom:8px">
        <div class="addrow"><input id="l_def_desc" class="inp" type="text" placeholder="Descripción" autocomplete="off"><button class="btn add" id="l_add_def">Añadir</button></div>
        <div class="deflist" id="l_def_list"></div>
      </div>
      <div class="actions"><button class="btn" id="l_save">Guardar línea aérea</button><button class="btn sec" id="l_clear">Limpiar</button></div>
    </div>

    <!-- INCIDENCIAS -->
    <div data-panel="incidencias" class="hide">
      <div class="field">
        <label class="l" for="i_title">Incidencia</label>
        <input id="i_title" class="inp" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label class="l" for="i_ubic">Ubicación</label>
        <input id="i_ubic" class="inp" type="text" autocomplete="off">
      </div>
      <div class="field">
        <label class="l" for="i_desc">Descripción</label>
        <textarea id="i_desc" class="inp" rows="3"></textarea>
      </div>
      <div class="actions"><button class="btn" id="i_save">Guardar incidencia</button><button class="btn sec" id="i_clear">Limpiar</button></div>
    </div>
  </section>

  <!-- Totales + compartir -->
  <section class="card">
    <h2 id="totTitle">Totales del día</h2>
    <div class="stats" id="stats"></div>
    <div class="share">
      <button class="btn wa" id="shareWa">WhatsApp</button>
      <button class="btn sec" id="shareSys">Compartir…</button>
      <button class="btn sec" id="copyTxt">Copiar texto</button>
      <button class="btn sec" id="exportCsv">Excel del día</button>
    </div>
  </section>

  <!-- Registro -->
  <section class="card">
    <h2>Registro del día</h2>
    <div id="records"></div>
  </section>

  <!-- Más opciones -->
  <details class="more">
    <summary>Más opciones</summary>
    <div class="morebody">
      <button class="btn sec" id="exportTxt">Descargar TXT del día</button>
      <button class="btn sec" id="exportCsvAll">Excel con todos los días</button>
      <button class="btn sec" id="exportBackup">Guardar copia de seguridad</button>
      <button class="btn sec" id="importBtn">Restaurar copia de seguridad</button>
      <input type="file" id="importFile" accept=".json,application/json" class="hide">
      <p class="hint">Los datos se guardan solo en este móvil. Haz una copia de seguridad de vez en cuando y guárdala en Drive o envíatela.</p>
      <button class="btn danger" id="clearDay">Borrar este día</button>
      <button class="btn danger" id="clearAll">Borrar TODOS los datos</button>
    </div>
  </details>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const KEY = 'prodrpr_data_v1';        // mismo almacén que la versión anterior
  const KEY_LAST = 'prodrpr_lastline';
  const $ = id => document.getElementById(id);

  // ---------- Datos ----------
  let db = load();
  function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)||'{}'); return (d && typeof d==='object') ? d : {}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('No se pudo guardar', true); } }
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

  function ensure(d,line){ if(!db[d]) db[d]={}; if(!db[d][line]) db[d][line]={centros:[],lineaAerea:[],incidencias:[]}; const o=db[d][line]; o.centros=o.centros||[]; o.lineaAerea=o.lineaAerea||[]; o.incidencias=o.incidencias||[]; return o; }
  function cleanup(d,line){
    if(db[d] && db[d][line]){ const o=db[d][line]; if(!(o.centros||[]).length && !(o.lineaAerea||[]).length && !(o.incidencias||[]).length) delete db[d][line]; }
    if(db[d] && !Object.keys(db[d]).length) delete db[d];
  }
  function removeEntry(d,line,section,id){ if(db[d] && db[d][line] && db[d][line][section]){ db[d][line][section]=db[d][line][section].filter(e=>e.id!==id); cleanup(d,line); } }

  // ---------- Utilidades ----------
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) && n>0 ? n : 0; };
  const fmt = n => (Math.round(n*100)/100).toLocaleString('es-ES');
  function localISO(dt){ const d=new Date(dt); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  const today = () => localISO(new Date());
  function prettyDate(iso){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(y,m-1,d); return dt.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}); }
  const shortDate = iso => iso.split('-').reverse().join('/');
  function download(content, filename, mime){ const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
  const safeName = s => s.replace(/[^a-z0-9.\-_]/gi,'_');
  let toastT; function toast(msg, err){ const t=$('toast'); t.textContent=msg; t.className='toast on'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast',2200); }

  // ---------- Fecha ----------
  const dateEl = $('date');
  dateEl.value = today();
  function setDate(iso){ dateEl.value = iso; onDateChange(); }
  function shiftDay(n){ const [y,m,d]=dateEl.value.split('-').map(Number); setDate(localISO(new Date(y,m-1,d+n))); }
  $('prevDay').onclick=()=>shiftDay(-1);
  $('nextDay').onclick=()=>shiftDay(1);
  dateEl.addEventListener('change', ()=>{ if(!dateEl.value) dateEl.value=today(); onDateChange(); });
  function onDateChange(){
    const d=dateEl.value; const isToday = d===today();
    $('dateLabel').textContent = (isToday?'Hoy · ':'') + prettyDate(d);
    $('totTitle').textContent = isToday ? 'Totales de hoy' : 'Totales del ' + shortDate(d);
    renderAll();
  }

  // ---------- Línea ----------
  const lineEl = $('lineName');
  try{ lineEl.value = localStorage.getItem(KEY_LAST)||''; }catch(e){}
  lineEl.addEventListener('input', ()=>{ try{ localStorage.setItem(KEY_LAST, lineEl.value); }catch(e){} renderChips(); });
  function knownLines(){
    const last = {};
    Object.keys(db).forEach(d=>Object.keys(db[d]).forEach(l=>{ if(!last[l] || d>last[l]) last[l]=d; }));
    return Object.keys(last).sort((a,b)=> last[b].localeCompare(last[a]) || a.localeCompare(b));
  }
  function renderChips(){
    const lines = knownLines();
    $('lineList').innerHTML = lines.map(l=>`<option value="${esc(l)}">`).join('');
    const cur = lineEl.value.trim();
    $('recentLines').innerHTML = lines.slice(0,6).map(l=>`<button class="chip${l===cur?' on':''}" data-line="${esc(l)}">${esc(l)}</button>`).join('');
  }
  $('recentLines').addEventListener('click', e=>{ const b=e.target.closest('[data-line]'); if(!b) return; lineEl.value=b.dataset.line; lineEl.dispatchEvent(new Event('input')); });
  function needLine(){ const l=lineEl.value.trim(); if(!l){ toast('Escribe primero el nombre de línea', true); lineEl.focus(); lineEl.scrollIntoView({behavior:'smooth',block:'center'}); return null; } return l; }

  // ---------- Pestañas ----------
  let tab='centros';
  function setTab(t){
    tab=t;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
    document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('hide', p.dataset.panel!==t));
    updateEditBar();
  }
  document.querySelector('.tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(b) setTab(b.dataset.tab); });

  // ---------- Controles ----------
  document.addEventListener('click', e=>{
    const b=e.target.closest('[data-step]'); if(!b) return;
    const inp=$(b.dataset.for); const step=parseFloat(b.dataset.step);
    inp.value = fmtInput(Math.max(0, num(inp.value)+step));
  });
  const fmtInput = n => String(Math.round(n*100)/100).replace('.',',');
  let cType='CT';
  function setCType(v){ cType=v; $('c_type').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); }
  $('c_type').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setCType(b.dataset.v); });

  // ---------- Defectos ----------
  let cDefs=[], lDefs=[];
  function renderDefs(){
    $('c_def_list').innerHTML = cDefs.map((d,i)=>`<div class="defitem"><div>${esc(d)}</div><button class="x" data-cdel="${i}" aria-label="Quitar">×</button></div>`).join('');
    $('l_def_list').innerHTML = lDefs.map((d,i)=>`<div class="defitem"><div>${d.ubicacion?'<b>'+esc(d.ubicacion)+'</b> — ':''}${esc(d.descripcion)}</div><button class="x" data-ldel="${i}" aria-label="Quitar">×</button></div>`).join('');
  }
  function addCDef(){ const t=$('c_def_text').value.trim(); if(!t) return false; cDefs.push(t); $('c_def_text').value=''; renderDefs(); return true; }
  function addLDef(){ const u=$('l_def_ubic').value.trim(), d=$('l_def_desc').value.trim(); if(!u&&!d) return false; lDefs.push({ubicacion:u,descripcion:d}); $('l_def_ubic').value=''; $('l_def_desc').value=''; renderDefs(); return true; }
  $('c_add_def').onclick=()=>{ if(addCDef()) $('c_def_text').focus(); };
  $('l_add_def').onclick=()=>{ if(addLDef()) $('l_def_ubic').focus(); };
  $('c_def_text').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addCDef(); } });
  $('l_def_desc').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addLDef(); } });
  $('c_def_list').addEventListener('click', e=>{ const b=e.target.closest('[data-cdel]'); if(b){ cDefs.splice(+b.dataset.cdel,1); renderDefs(); } });
  $('l_def_list').addEventListener('click', e=>{ const b=e.target.closest('[data-ldel]'); if(b){ lDefs.splice(+b.dataset.ldel,1); renderDefs(); } });

  // ---------- Edición ----------
  let editing=null; // {section,id,date,line}
  const secName = {centros:'centro', lineaAerea:'línea aérea', incidencias:'incidencia'};
  function updateEditBar(){
    const on = editing && editing.section===tab;
    $('editBar').classList.toggle('on', !!on);
    if(on) $('editText').textContent = 'Editando ' + secName[editing.section] + ' (' + editing.line + ')';
    $('c_save').textContent = (editing&&editing.section==='centros') ? 'Guardar cambios' : 'Guardar centro';
    $('l_save').textContent = (editing&&editing.section==='lineaAerea') ? 'Guardar cambios' : 'Guardar línea aérea';
    $('i_save').textContent = (editing&&editing.section==='incidencias') ? 'Guardar cambios' : 'Guardar incidencia';
  }
  $('cancelEdit').onclick=()=>{ const s=editing&&editing.section; editing=null; if(s==='centros') resetC(); if(s==='lineaAerea') resetL(); if(s==='incidencias') resetI(); updateEditBar(); };

  function commit(section, entry){
    const d=dateEl.value; const line=lineEl.value.trim();
    if(editing && editing.section===section){
      entry.id = editing.id;
      const old = db[editing.date] && db[editing.date][editing.line] && (db[editing.date][editing.line][section]||[]).find(e=>e.id===editing.id);
      if(old && old.createdAt) entry.createdAt = old.createdAt;
      if(editing.date!==d || editing.line!==line) removeEntry(editing.date, editing.line, section, editing.id);
    }
    const list = ensure(d,line)[section];
    const i = list.findIndex(e=>e.id===entry.id);
    if(i>=0) list[i]=entry; else list.push(entry);
    const wasEdit = !!(editing && editing.section===section);
    editing=null; save(); renderAll(); renderChips(); updateEditBar();
    toast(wasEdit ? 'Cambios guardados' : 'Guardado ✓');
  }

  // Centros
  function resetC(){ $('c_name').value=''; setCType('CT'); $('c_repos').value=0; $('c_punctual').checked=false; $('c_def_text').value=''; cDefs=[]; renderDefs(); if(editing&&editing.section==='centros'){editing=null;} updateEditBar(); }
  $('c_clear').onclick=resetC;
  $('c_save').onclick=()=>{
    if(!needLine()) return;
    const name=$('c_name').value.trim();
    if(!name){ toast('Escribe el nombre del centro', true); $('c_name').focus(); return; }
    addCDef(); // si había un defecto escrito sin pulsar "Añadir", se incluye
    commit('centros', { id:uid(), name, type:cType, reposiciones:Math.round(num($('c_repos').value)), defects:cDefs.map(d=>({descripcion:d})), puntual:$('c_punctual').checked, createdAt:new Date().toISOString() });
    cDefs=[]; resetC(); $('c_name').focus();
  };

  // Línea aérea
  function resetL(){ $('l_repos').value=0; $('l_medidas').value=0; $('l_kms').value=0; $('l_med_punct').checked=false; $('l_kms_punct').checked=false; $('l_def_ubic').value=''; $('l_def_desc').value=''; lDefs=[]; renderDefs(); if(editing&&editing.section==='lineaAerea'){editing=null;} updateEditBar(); }
  $('l_clear').onclick=resetL;
  $('l_save').onclick=()=>{
    if(!needLine()) return;
    addLDef();
    const e={ id:uid(), reposiciones:Math.round(num($('l_repos').value)), medidas:Math.round(num($('l_medidas').value)), kms:Math.round(num($('l_kms').value)*100)/100, defects:lDefs.map(d=>({ubicacion:d.ubicacion,descripcion:d.descripcion})), kmsPunctual:$('l_kms_punct').checked, medidasPunctual:$('l_med_punct').checked, createdAt:new Date().toISOString() };
    if(!e.reposiciones && !e.medidas && !e.kms && !e.defects.length){ toast('No hay nada que guardar', true); return; }
    commit('lineaAerea', e); resetL();
  };

  // Incidencias
  function resetI(){ $('i_title').value=''; $('i_ubic').value=''; $('i_desc').value=''; if(editing&&editing.section==='incidencias'){editing=null;} updateEditBar(); }
  $('i_clear').onclick=resetI;
  $('i_save').onclick=()=>{
    if(!needLine()) return;
    const e={ id:uid(), incidencia:$('i_title').value.trim(), ubicacion:$('i_ubic').value.trim(), descripcion:$('i_desc').value.trim(), createdAt:new Date().toISOString() };
    if(!e.incidencia && !e.descripcion){ toast('Escribe la incidencia o una descripción', true); $('i_title').focus(); return; }
    commit('incidencias', e); resetI();
  };

  function startEdit(line, section, id){
    const d=dateEl.value; const e = db[d]&&db[d][line]&&(db[d][line][section]||[]).find(x=>x.id===id); if(!e) return;
    editing={section,id,date:d,line};
    lineEl.value=line; try{ localStorage.setItem(KEY_LAST,line); }catch(_){}
    renderChips();
    if(section==='centros'){ $('c_name').value=e.name||''; setCType(e.type||'CT'); $('c_repos').value=e.reposiciones||0; $('c_punctual').checked=!!e.puntual; cDefs=(e.defects||[]).map(x=>x.descripcion||''); }
    if(section==='lineaAerea'){ $('l_repos').value=e.reposiciones||0; $('l_medidas').value=e.medidas||0; $("l_kms").value=String(e.kms||0).replace(".",","); $('l_med_punct').checked=!!e.medidasPunctual; $('l_kms_punct').checked=!!e.kmsPunctual; lDefs=(e.defects||[]).map(x=>({ubicacion:x.ubicacion||'',descripcion:x.descripcion||''})); }
    if(section==='incidencias'){ $('i_title').value=e.incidencia||''; $('i_ubic').value=e.ubicacion||''; $('i_desc').value=e.descripcion||''; }
    renderDefs(); setTab(section);
    $('formCard').scrollIntoView({behavior:'smooth', block:'start'});
  }

  // ---------- Totales ----------
  function totals(d){
    const t={centros:0,CT:0,PT:0,ST:0,repos:0,kms:0,medidas:0,defectos:0,incid:0,lineas:0};
    const day=db[d]||{};
    Object.keys(day).forEach(l=>{
      const o=day[l]; t.lineas++;
      (o.centros||[]).forEach(c=>{ t.centros++; if(t[c.type]!==undefined) t[c.type]++; t.repos+=+c.reposiciones||0; t.defectos+=(c.defects||[]).length; });
      (o.lineaAerea||[]).forEach(a=>{ t.repos+=+a.reposiciones||0; t.kms+=+a.kms||0; t.medidas+=+a.medidas||0; t.defectos+=(a.defects||[]).length; });
      t.incid+=(o.incidencias||[]).length;
    });
    return t;
  }
  function renderStats(){
    const t=totals(dateEl.value);
    const br=[['CT',t.CT],['PT',t.PT],['ST',t.ST]].filter(x=>x[1]).map(x=>x[1]+' '+x[0]).join(' · ');
    $('stats').innerHTML = [
      ['Centros', t.centros, br],
      ['Reposiciones', t.repos],
      ['Km revisados', fmt(t.kms)],
      ['Medidas', t.medidas],
      ['Defectos', t.defectos],
      ['Incidencias', t.incid],
    ].map(s=>`<div class="stat"><b>${s[1]}</b><span>${s[0]}</span>${s[2]?`<em>${s[2]}</em>`:''}</div>`).join('');
  }

  // ---------- Registro ----------
  function renderAll(){
    renderStats();
    const d=dateEl.value; const day=db[d]||{}; const lines=Object.keys(day);
    const el=$('records');
    if(!lines.length){ el.innerHTML='<div class="empty">No hay registros para este día.</div>'; return; }
    el.innerHTML = lines.map(line=>{
      const o=day[line]; const L=esc(line);
      const ops=(sec,id)=>`<div class="ops"><button class="op" data-edit="${id}" data-sec="${sec}" data-line="${L}">Editar</button><button class="op del" data-del="${id}" data-sec="${sec}" data-line="${L}">Borrar</button></div>`;
      let h=`<div class="lineblock"><div class="linehead"><h3>${L}<small>${(o.centros||[]).length} centros · ${(o.lineaAerea||[]).length} línea aérea · ${(o.incidencias||[]).length} incidencias</small></h3><button class="op del" data-delline="${L}">Borrar línea</button></div>`;
      if((o.centros||[]).length){ h+='<div class="sub">Centros</div>'; o.centros.forEach(c=>{
        h+=`<div class="rec"><div class="body"><span class="tag">${esc(c.type)}</span><b>${esc(c.name)||'(sin nombre)'}</b>${c.puntual?' <span class="tag p">Puntual</span>':''}<div class="meta">Reposiciones: ${c.reposiciones||0}</div>${(c.defects||[]).length?'<ul>'+c.defects.map(x=>`<li>${esc(x.descripcion)}</li>`).join('')+'</ul>':''}</div>${ops('centros',c.id)}</div>`; }); }
      if((o.lineaAerea||[]).length){ h+='<div class="sub">Línea aérea</div>'; o.lineaAerea.forEach(a=>{
        h+=`<div class="rec"><div class="body"><b>${fmt(+a.kms||0)} km</b>${a.kmsPunctual?' <span class="tag p">Puntual</span>':''}<div class="meta">Medidas: ${a.medidas||0}${a.medidasPunctual?' (puntual)':''} · Reposiciones: ${a.reposiciones||0}</div>${(a.defects||[]).length?'<ul>'+a.defects.map(x=>`<li>${x.ubicacion?'<b>'+esc(x.ubicacion)+'</b> — ':''}${esc(x.descripcion)}</li>`).join('')+'</ul>':''}</div>${ops('lineaAerea',a.id)}</div>`; }); }
      if((o.incidencias||[]).length){ h+='<div class="sub">Incidencias</div>'; o.incidencias.forEach(i=>{
        h+=`<div class="rec"><div class="body"><b>${esc(i.incidencia)||'(sin título)'}</b>${i.ubicacion?`<div class="meta">📍 ${esc(i.ubicacion)}</div>`:''}${i.descripcion?`<div class="meta">${esc(i.descripcion)}</div>`:''}</div>${ops('incidencias',i.id)}</div>`; }); }
      return h+'</div>';
    }).join('');
  }
  $('records').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return; const d=dateEl.value;
    if(b.dataset.edit) startEdit(b.dataset.line, b.dataset.sec, b.dataset.edit);
    else if(b.dataset.del){ if(!confirm('¿Borrar este registro?')) return; removeEntry(d,b.dataset.line,b.dataset.sec,b.dataset.del); if(editing&&editing.id===b.dataset.del){ editing=null; updateEditBar(); } save(); renderAll(); renderChips(); toast('Registro borrado'); }
    else if(b.dataset.delline){ if(!confirm('¿Borrar TODOS los registros de "'+b.dataset.delline+'" de este día?')) return; delete db[d][b.dataset.delline]; cleanup(d,''); save(); renderAll(); renderChips(); toast('Línea borrada'); }
  });

  // ---------- Texto resumen ----------
  function summaryText(d, wa){
    const B = s => wa ? '*'+s+'*' : s;
    const day=db[d]; if(!day||!Object.keys(day).length) return null;
    const out=[B('PRODUCCIÓN RPR — '+shortDate(d)), ''];
    Object.keys(day).forEach(line=>{
      const o=day[line];
      out.push(B('LÍNEA: '+line));
      if((o.centros||[]).length){ out.push('Centros:'); o.centros.forEach(c=>{
        out.push(`• ${c.type} ${c.name||'(sin nombre)'} — Repos: ${c.reposiciones||0}${c.puntual?' · Puntual':''}`);
        (c.defects||[]).forEach(x=>out.push(`   ⚠ ${x.descripcion}`)); }); }
      if((o.lineaAerea||[]).length){ out.push('Línea aérea:'); o.lineaAerea.forEach(a=>{
        out.push(`• Kms: ${fmt(+a.kms||0)}${a.kmsPunctual?' (P)':''} · Medidas: ${a.medidas||0}${a.medidasPunctual?' (P)':''} · Repos: ${a.reposiciones||0}`);
        (a.defects||[]).forEach(x=>out.push(`   ⚠ ${x.ubicacion?x.ubicacion+' - ':''}${x.descripcion}`)); }); }
      if((o.incidencias||[]).length){ out.push('Incidencias:'); o.incidencias.forEach(i=>{
        out.push(`• ${i.incidencia||'(sin título)'}${i.ubicacion?' | '+i.ubicacion:''}`);
        if(i.descripcion) out.push('   '+i.descripcion); }); }
      out.push('');
    });
    const t=totals(d);
    out.push(B('TOTAL')+`: ${t.centros} centros · ${t.repos} reposiciones · ${fmt(t.kms)} km · ${t.medidas} medidas · ${t.defectos} defectos · ${t.incid} incidencias`);
    return out.join('\n');
  }
  function needText(wa){ const t=summaryText(dateEl.value, wa); if(!t) toast('No hay registros este día', true); return t; }

  $('shareWa').onclick=()=>{ const t=needText(true); if(t) window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank'); };
  $('shareSys').onclick=async()=>{
    const t=needText(true); if(!t) return;
    if(navigator.share){ try{ await navigator.share({title:'Producción '+shortDate(dateEl.value), text:t}); }catch(e){} }
    else copy(t);
  };
  $('copyTxt').onclick=()=>{ const t=needText(false); if(t) copy(t); };
  async function copy(t){
    try{ await navigator.clipboard.writeText(t); toast('Texto copiado'); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Texto copiado'); }catch(_){ toast('No se pudo copiar', true); } ta.remove(); }
  }
  $('exportTxt').onclick=()=>{ const t=needText(false); if(t) download(t, `Prod_${dateEl.value}.txt`, 'text/plain;charset=utf-8'); };

  // ---------- Excel (CSV) ----------
  function csv(dates){
    const q = v => { const s=String(v==null?'':v); return /[;"\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
    const n = v => String(Math.round((+v||0)*100)/100).replace('.',',');
    const si = b => b?'SI':'NO';
    const rows=[['Fecha','Línea','Trabajo','Centro','Tipo','Reposiciones','Puntual','Medidas','Medidas puntual','Kms','Kms puntual','Defectos','Incidencia','Ubicación','Descripción']];
    dates.forEach(d=>Object.keys(db[d]||{}).forEach(line=>{
      const o=db[d][line]; const f=shortDate(d);
      (o.centros||[]).forEach(c=>rows.push([f,line,'Centro',c.name,c.type,c.reposiciones||0,si(c.puntual),'','','','',(c.defects||[]).map(x=>x.descripcion).join(' | '),'','','']));
      (o.lineaAerea||[]).forEach(a=>rows.push([f,line,'Línea aérea','','',a.reposiciones||0,'',a.medidas||0,si(a.medidasPunctual),n(a.kms),si(a.kmsPunctual),(a.defects||[]).map(x=>(x.ubicacion?x.ubicacion+' - ':'')+x.descripcion).join(' | '),'','','']));
      (o.incidencias||[]).forEach(i=>rows.push([f,line,'Incidencia','','','','','','','','','',i.incidencia,i.ubicacion,i.descripcion]));
    }));
    return '﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  }
  $('exportCsv').onclick=()=>{ const d=dateEl.value; if(!db[d]){ toast('No hay registros este día', true); return; } download(csv([d]), `Prod_${d}.csv`, 'text/csv;charset=utf-8'); };
  $('exportCsvAll').onclick=()=>{ const ds=Object.keys(db).sort(); if(!ds.length){ toast('No hay datos', true); return; } download(csv(ds), `ProdRPR_todo_${today()}.csv`, 'text/csv;charset=utf-8'); };

  // ---------- Copia de seguridad ----------
  $('exportBackup').onclick=()=>{ download(JSON.stringify(db,null,2), `prodrpr_backup_${today()}.json`, 'application/json'); toast('Copia descargada'); };
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').addEventListener('change', async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    let data; try{ data=JSON.parse(await f.text()); }catch(_){ toast('Archivo no válido', true); return; }
    if(!data||typeof data!=='object'){ toast('Archivo no válido', true); return; }
    let added=0;
    Object.keys(data).forEach(d=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||typeof data[d]!=='object') return;
      Object.keys(data[d]).forEach(line=>{ const src=data[d][line]||{}; const dst=ensure(d,line);
        ['centros','lineaAerea','incidencias'].forEach(s=>(Array.isArray(src[s])?src[s]:[]).forEach(it=>{ if(it&&it.id&&!dst[s].some(x=>x.id===it.id)){ dst[s].push(it); added++; } }));
        cleanup(d,line);
      }); });
    save(); renderAll(); renderChips();
    toast(added ? `Restaurados ${added} registros` : 'No había registros nuevos');
  });

  // ---------- Borrado ----------
  $('clearDay').onclick=()=>{ const d=dateEl.value; if(!db[d]){ toast('Este día no tiene registros'); return; } if(!confirm('¿Borrar todos los registros del '+shortDate(d)+'?')) return; delete db[d]; save(); renderAll(); renderChips(); toast('Día borrado'); };
  $('clearAll').onclick=()=>{ if(!confirm('¿Borrar TODOS los datos de TODOS los días?')) return; if(!confirm('Esto no se puede deshacer. ¿Seguro? (Recomendado: guarda antes una copia de seguridad)')) return; db={}; save(); renderAll(); renderChips(); toast('Todos los datos borrados'); };

  // ---------- Inicio ----------
  renderDefs(); renderChips(); onDateChange();

  // Volver a "hoy" si la app se queda abierta y cambia el día
  let lastToday=today();
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ const t=today(); if(t!==lastToday){ if(dateEl.value===lastToday) setDate(t); lastToday=t; } } });

  if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{})); }
})();
</script>
</body>
</html>
